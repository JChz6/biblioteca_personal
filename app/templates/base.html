<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biblioteca Personal{% endblock %}</title>

  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v={{ static_version }}">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v={{ static_version }}">
  <link rel="shortcut icon" href="/static/favicon.ico?v={{ static_version }}">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v={{ static_version }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Biblioteca">
  <meta name="theme-color" content="#05050a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>

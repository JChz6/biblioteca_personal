<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biblioteca Personal{% endblock %}</title>

  <link rel="icon" type="image/svg+xml" href="/static/library-icon.svg?v={{ static_version }}">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/library-touch-icon.png?v={{ static_version }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Biblioteca">
  <meta name="theme-color" content="#181816">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Text:wght@400;700&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
